<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reclamá tu bono de bienvenida en CASINOENCASA.">
  <title>Reclamá ahora | CASINOENCASA</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="landing-shell">
    <section class="signup-panel" aria-labelledby="page-title">
      <div class="hero-image-wrap">
        <img class="hero-image" src="./assets/hero.webp" alt="Promoción CASINOENCASA con bono de bienvenida">
        <div class="online-badge"><span class="online-dot"></span> Online 24 hs</div>
      </div>

      <p class="eyebrow">¡BIENVENIDO A CASINOENCASA!</p>
      <h1 id="page-title">Reclama <span>AHORA</span></h1>

      <div class="bonus-box">
        <strong>🔥 BONO 75%</strong>
        <span>en tu primera carga!!</span>
      </div>

      <form id="signup-form" class="signup-form">
        <label for="nickname">Tu apodo</label>
        <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="Ej: Martín" required>
        <button class="agent-button" type="submit">¡llamar a un agente!</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="trust-row" aria-label="Beneficios">
        <span>🔒 Registro seguro</span>
        <span>💳 Sin tarjeta</span>
        <span>⚡ Gratis</span>
      </div>

      <p class="responsibility">+18 · Jugá con responsabilidad</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
